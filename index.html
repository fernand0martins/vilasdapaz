<footer><span>© <span id="year">2026</span> Vilas da Paz</span><span><span data-i18n="text051"></span></span></footer><script>
document.getElementById('year').textContent=new Date().getFullYear();
const selector=document.getElementById('language-select');
const translations={};
async function setLanguage(lang){
  if(!['en','pt'].includes(lang))lang='en';
  try{
    if(!translations[lang]){const response=await fetch('./locales/'+lang+'.json');if(!response.ok)throw new Error('Translation load failed');translations[lang]=await response.json();}
    document.querySelectorAll('[data-i18n]').forEach(el=>{const value=translations[lang][el.dataset.i18n];if(value!==undefined)el.innerHTML=value;});
    document.documentElement.lang=lang;selector.value=lang;localStorage.setItem('vilasdapaz-language',lang);
    document.title=lang==='pt'?'Vilas da Paz — Espaço para um novo começo':'Vilas da Paz — Room for a new beginning';
    document.querySelector('meta[name="description"]').content=lang==='pt'?'Descubra Vilas da Paz — um novo projeto residencial. Mais informações brevemente.':'Discover Vilas da Paz — a new residential construction project. Project details coming soon.';
  }catch(error){console.error('Unable to load translations',error);}
}
selector.addEventListener('change',()=>setLanguage(selector.value));
const saved=localStorage.getItem('vilasdapaz-language');
setLanguage(['en','pt'].includes(saved)?saved:(navigator.language.toLowerCase().startsWith('pt')?'pt':'en'));
</script></body></html>
